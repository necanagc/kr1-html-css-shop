<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Оформление заявки на покупку товара.">
  <title>МузТорг Жуковский</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <div class="site-header__inner">
      <img class="header--img__logo" src="images/image.png">
      <a class="site-header__logo" href="index.html">МузТорг Жуковский</a>
      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
                    <li class="site-nav__item"><a class="site-nav__link site-nav__link--active" href="orders.html" aria-current="page">Заявки</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="index.html#popular">Популярные товары</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__current">Заявки</span>
    </nav>

    <section class="section order-page">
      <h1 class="order-page__title">Заявка на покупку</h1>
      <p class="order-page__description">Заполните данные, чтобы оформить заказ.</p>

      <form class="order-form order-page__form" id="purchase-order-form">
        <div class="order-form__field">
          <label class="order-form__label" for="customer-name">Имя</label>
          <input class="order-form__input" id="customer-name" name="name" type="text" minlength="2" autocomplete="name" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="customer-email">E-mail</label>
          <input class="order-form__input" id="customer-email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="customer-phone">Телефон</label>
          <input class="order-form__input" id="customer-phone" name="phone" type="tel" autocomplete="tel" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-product">Товар</label>
          <select class="order-form__select" id="order-product" name="product" required>
            <option value="">Выберите товар</option>
            <option value="Микшер Behringer">Микшер Behringer — 10 000 руб.</option>
            <option value="Микрофон Shure">Микрофон Shure — 12 000 руб.</option>
            <option value="DJ-контроллер">DJ-контроллер — 50 000 руб.</option>
          </select>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-quantity">Количество</label>
          <input class="order-form__input" id="order-quantity" name="quantity" type="number" min="1" max="99" value="1" required>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="delivery-address">Адрес доставки</label>
          <textarea class="order-form__textarea" id="delivery-address" name="address" rows="3" autocomplete="street-address" required></textarea>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-comment">Комментарий</label>
          <textarea class="order-form__textarea" id="order-comment" name="comment" rows="3"></textarea>
        </div>

        <div class="order-form__field">
          <label class="order-form__label" for="order-agreement">
            <input id="order-agreement" name="agreement" type="checkbox" required>
            Согласен на обработку данных
          </label>
        </div>

        <div class="order-form__actions">
          <button class="button button--primary" type="submit">Отправить заявку</button>
        </div>
      </form>

      <p class="success-message" id="order-success" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 МузТорг Жуковский. Все права защищены.</p>
    <p>Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>
  <a class="scroll-top" href="#top" aria-label="Наверх" title="Наверх">↑</a>
</body>
</html>
